<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 460" fill="none" role="img" aria-label="ECU Diagnostics">
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0f2f5"/>
      <stop offset="35%" stop-color="#c8ccd4"/>
      <stop offset="55%" stop-color="#9aa1ad"/>
      <stop offset="75%" stop-color="#d8dce4"/>
      <stop offset="100%" stop-color="#8b929e"/>
    </linearGradient>
    <linearGradient id="metalDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6a7180"/>
      <stop offset="40%" stop-color="#3a404c"/>
      <stop offset="100%" stop-color="#1e232c"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c44dff"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c44dff"/>
      <stop offset="100%" stop-color="#e879f9"/>
    </linearGradient>
    <filter id="glowP" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowC" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowText" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- circuit traces left (purple) -->
  <g stroke="#c44dff" stroke-width="1.6" stroke-linecap="round" opacity="0.85" filter="url(#glowP)">
    <path d="M28 70 V110 H48"/>
    <path d="M40 55 V95 H48"/>
    <path d="M52 40 V80"/>
    <path d="M20 140 H48"/>
    <path d="M32 160 H48"/>
    <path d="M24 185 H48"/>
    <path d="M36 210 H48"/>
    <path d="M28 240 H48"/>
    <path d="M44 265 V230"/>
    <circle cx="28" cy="70" r="2.2" fill="#c44dff"/>
    <circle cx="40" cy="55" r="2.2" fill="#c44dff"/>
    <circle cx="20" cy="140" r="2.2" fill="#c44dff"/>
    <circle cx="24" cy="185" r="2.2" fill="#c44dff"/>
  </g>

  <!-- circuit traces right (cyan) -->
  <g stroke="#00e5ff" stroke-width="1.6" stroke-linecap="round" opacity="0.85" filter="url(#glowC)">
    <path d="M372 70 V110 H352"/>
    <path d="M360 55 V95 H352"/>
    <path d="M348 40 V80"/>
    <path d="M380 140 H352"/>
    <path d="M368 160 H352"/>
    <path d="M376 185 H352"/>
    <path d="M364 210 H352"/>
    <path d="M372 240 H352"/>
    <path d="M356 265 V230"/>
    <circle cx="372" cy="70" r="2.2" fill="#00e5ff"/>
    <circle cx="360" cy="55" r="2.2" fill="#00e5ff"/>
    <circle cx="380" cy="140" r="2.2" fill="#00e5ff"/>
    <circle cx="376" cy="185" r="2.2" fill="#00e5ff"/>
  </g>

  <!-- outer chip package -->
  <rect x="90" y="48" width="220" height="220" rx="18" fill="url(#metalDark)" stroke="url(#edge)" stroke-width="3"/>
  <!-- edge glow accents -->
  <path d="M100 58 V250" stroke="#c44dff" stroke-width="2" opacity="0.55" filter="url(#glowP)" stroke-linecap="round"/>
  <path d="M300 58 V250" stroke="#00e5ff" stroke-width="2" opacity="0.55" filter="url(#glowC)" stroke-linecap="round"/>

  <!-- outer pins -->
  <g fill="url(#metal)">
    <!-- top -->
    <rect x="120" y="34" width="10" height="16" rx="2"/>
    <rect x="142" y="34" width="10" height="16" rx="2"/>
    <rect x="164" y="34" width="10" height="16" rx="2"/>
    <rect x="186" y="34" width="10" height="16" rx="2"/>
    <rect x="208" y="34" width="10" height="16" rx="2"/>
    <rect x="230" y="34" width="10" height="16" rx="2"/>
    <rect x="252" y="34" width="10" height="16" rx="2"/>
    <rect x="274" y="34" width="10" height="16" rx="2"/>
    <!-- bottom -->
    <rect x="120" y="266" width="10" height="16" rx="2"/>
    <rect x="142" y="266" width="10" height="16" rx="2"/>
    <rect x="164" y="266" width="10" height="16" rx="2"/>
    <rect x="186" y="266" width="10" height="16" rx="2"/>
    <rect x="208" y="266" width="10" height="16" rx="2"/>
    <rect x="230" y="266" width="10" height="16" rx="2"/>
    <rect x="252" y="266" width="10" height="16" rx="2"/>
    <rect x="274" y="266" width="10" height="16" rx="2"/>
    <!-- left -->
    <rect x="76" y="80" width="16" height="10" rx="2"/>
    <rect x="76" y="102" width="16" height="10" rx="2"/>
    <rect x="76" y="124" width="16" height="10" rx="2"/>
    <rect x="76" y="146" width="16" height="10" rx="2"/>
    <rect x="76" y="168" width="16" height="10" rx="2"/>
    <rect x="76" y="190" width="16" height="10" rx="2"/>
    <rect x="76" y="212" width="16" height="10" rx="2"/>
    <!-- right -->
    <rect x="308" y="80" width="16" height="10" rx="2"/>
    <rect x="308" y="102" width="16" height="10" rx="2"/>
    <rect x="308" y="124" width="16" height="10" rx="2"/>
    <rect x="308" y="146" width="16" height="10" rx="2"/>
    <rect x="308" y="168" width="16" height="10" rx="2"/>
    <rect x="308" y="190" width="16" height="10" rx="2"/>
    <rect x="308" y="212" width="16" height="10" rx="2"/>
  </g>

  <!-- surface details on package -->
  <g stroke="#5a6270" stroke-width="1" opacity="0.45">
    <path d="M112 90 H160 M112 102 H148"/>
    <path d="M250 200 H288 M260 214 H288"/>
    <circle cx="280" cy="90" r="3"/>
    <circle cx="120" cy="220" r="3"/>
  </g>

  <!-- inner die -->
  <rect x="130" y="88" width="140" height="140" rx="12" fill="#0c1018" stroke="url(#metal)" stroke-width="8"/>
  <!-- inner pins -->
  <g fill="url(#metal)">
    <rect x="150" y="80" width="8" height="12" rx="1.5"/>
    <rect x="168" y="80" width="8" height="12" rx="1.5"/>
    <rect x="186" y="80" width="8" height="12" rx="1.5"/>
    <rect x="204" y="80" width="8" height="12" rx="1.5"/>
    <rect x="222" y="80" width="8" height="12" rx="1.5"/>
    <rect x="240" y="80" width="8" height="12" rx="1.5"/>
    <rect x="150" y="224" width="8" height="12" rx="1.5"/>
    <rect x="168" y="224" width="8" height="12" rx="1.5"/>
    <rect x="186" y="224" width="8" height="12" rx="1.5"/>
    <rect x="204" y="224" width="8" height="12" rx="1.5"/>
    <rect x="222" y="224" width="8" height="12" rx="1.5"/>
    <rect x="240" y="224" width="8" height="12" rx="1.5"/>
    <rect x="122" y="110" width="12" height="8" rx="1.5"/>
    <rect x="122" y="130" width="12" height="8" rx="1.5"/>
    <rect x="122" y="150" width="12" height="8" rx="1.5"/>
    <rect x="122" y="170" width="12" height="8" rx="1.5"/>
    <rect x="122" y="190" width="12" height="8" rx="1.5"/>
    <rect x="266" y="110" width="12" height="8" rx="1.5"/>
    <rect x="266" y="130" width="12" height="8" rx="1.5"/>
    <rect x="266" y="150" width="12" height="8" rx="1.5"/>
    <rect x="266" y="170" width="12" height="8" rx="1.5"/>
    <rect x="266" y="190" width="12" height="8" rx="1.5"/>
  </g>

  <!-- waveform (V) purple — like original -->
  <path d="M148 152 H168 C172 152 174 120 182 120 C190 120 192 200 200 200 C208 200 210 152 250 152"
        stroke="url(#wave)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glowP)"/>

  <!-- probe cyan -->
  <g filter="url(#glowC)">
    <circle cx="200" cy="158" r="5.5" fill="none" stroke="#00e5ff" stroke-width="3"/>
    <circle cx="200" cy="158" r="2.2" fill="#00e5ff"/>
    <path d="M204 154 L250 112" stroke="#00e5ff" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="214" cy="140" r="2.5" fill="#7cf5ff"/>
  </g>

  <!-- ECU metal text -->
  <text x="200" y="340" text-anchor="middle"
        font-family="Arial Black, Arial, Helvetica, sans-serif"
        font-size="78" font-weight="900" letter-spacing="4"
        fill="url(#metal)"
        style="paint-order: stroke fill; stroke: #1a1e28; stroke-width: 2px;">ECU</text>

  <!-- DIAGNOSTICS neon -->
  <text x="200" y="395" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="28" font-weight="700" letter-spacing="6"
        fill="none" stroke="#c44dff" stroke-width="2.2"
        filter="url(#glowText)">DIAGNOSTICS</text>
  <text x="200" y="395" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="28" font-weight="700" letter-spacing="6"
        fill="#e879f9" opacity="0.35">DIAGNOSTICS</text>

  <!-- small spark -->
  <path d="M340 400 L344 390 L348 400 L358 404 L348 408 L344 418 L340 408 L330 404 Z"
        fill="#00e5ff" opacity="0.7" filter="url(#glowC)"/>
</svg>
